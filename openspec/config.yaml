schema: spec-driven

context: |
  Product: clipt, a minimal, keyboard-driven TUI note-taking app.
  Notes are markdown files in ONE flat directory (no subfolders); file name == note name.
  Modes: fuzzy finder (by file name), preview (rendered markdown), edit (insert-only, no vim normal mode).
  Finder: lists notes by mtime (newest first), hides the current note, fuzzy-matches the query
  literally against names (no .md handling), and appends a last "Create <query>" row when the
  query is non-empty and no note has that exact name. Enter on a note opens preview; enter on the
  create row writes "<query>.md" and enters edit. Esc returns to the current note's preview or
  quits when none is open (it never clears the query). ctrl+o changes the notes directory.
  Root model holds an optional "current note": set on open/create, updated by rename, cleared by
  delete and by changing the directory. Edit always returns to preview.
  Preview: acts on the open note: edit, rename (refuses to overwrite an existing note),
  delete with y/n confirmation (then returns to finder).
  Saving: auto-save on leaving edit mode (Esc); no explicit save command.
  Config: clipt/config.toml under the platform config dir (os.UserConfigDir: XDG on Linux,
  %AppData% on Windows, ~/Library/Application Support on macOS); single key notes_dir.
  Notes dir chosen in-app via a single path input with ~ expansion on first run or when the
  configured dir is gone; missing dirs are created after a y/n prompt.
  Platforms: Linux, Windows, macOS via platform-neutral std APIs. Development and tests run on
  Linux only; Windows/macOS get a manual pass after v1, fixes land as separate changes.
  Tech stack: Go, Bubble Tea (TUI), Bubbles textarea/textinput, Glamour (markdown render),
  Lip Gloss (styling), BurntSushi/toml (config). Fuzzy matching is an in-house case-insensitive
  subsequence match that keeps mtime order (no scoring, no library).
  Theme: gruvbox dark palette, all styles in one theme package; a config override is a later change.
  Module path: github.com/llysyganicz/clipt
  VCS: Jujutsu (jj), colocated with git.
  Out of scope (v1): content search, folders, tags, sync, vim normal mode.

rules:
  proposal:
    - Keep scope minimal; state explicit non-goals
  design:
    - Model each mode as its own Bubble Tea model; root model routes between them
  tasks:
    - Every task touching file I/O includes a test using a temp dir

