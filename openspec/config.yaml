schema: spec-driven

context: |
  Product: clipt, a minimal, keyboard-driven TUI note-taking app.
  Notes are markdown files in ONE flat directory (no subfolders); file name == note name.
  Modes: fuzzy finder (by file name), preview (rendered markdown), edit (always insert mode, no vim
  normal mode; Shift/Ctrl+Shift+arrows and ctrl+g select, typing replaces the selection,
  ctrl+shift+c copies it to the system clipboard), template insert (picker + form, entered from
  edit with ctrl+t).
  Finder: lists notes by mtime (newest first), hides the current note, fuzzy-matches the query
  literally against names (no .md handling), and appends a last "Create <query>" row when the
  query is non-empty and no note has that exact name. Enter on a note opens preview; enter on the
  create row writes "<query>.md" and enters edit. Esc returns to the current note's preview or
  quits when none is open (it never clears the query). ctrl+o changes the notes directory.
  Root model holds an optional "current note": set on open/create, updated by rename, cleared by
  delete and by changing the directory. Edit always returns to preview.
  Preview: acts on the open note: edit, rename (refuses to overwrite an existing note),
  delete with y/n confirmation (then returns to finder).
  Saving: auto-save on leaving edit mode (Esc); no explicit save command.
  Templates: markdown files in <notes_dir>/.templates (never listed as notes). Optional YAML front
  matter between --- fences with a "form" list of fields (name, label, type: text | number (default 0)
  | option (options list, default first)); the body uses {{name}} placeholders, expanded literally
  in one pass. Finder toggles a template scope with ctrl+t (Enter opens the template straight in
  edit, create row writes a skeleton, Esc returns to notes scope); templates never become the
  current note. In edit, ctrl+t opens the template picker then the form and inserts the expanded
  body at the cursor; Esc anywhere in insert mode returns to edit unchanged. TOML front matter and
  nested templates are out of scope.
  Tags: notes and templates may start with YAML front matter (same --- fences) whose "tags" key is
  a list of scalars (trimmed, blanks and case-insensitive repeats dropped). Query words starting
  with # are case-insensitive tag prefix filters (all must match); the rest is the name query. The
  create row writes the query's tags into the new note or template skeleton. Rows show tags dimmed;
  preview hides front matter and shows a tags header. Inserting a template merges its tags into the
  note's front matter line by line; clipt never otherwise rewrites front matter.
  Config: clipt/config.toml under the platform config dir (os.UserConfigDir: XDG on Linux,
  %AppData% on Windows, ~/Library/Application Support on macOS); keys notes_dir (required) and
  theme (optional). The picker rewrites the file keeping theme.
  Notes dir chosen in-app via a single path input with ~ expansion on first run or when the
  configured dir is gone; missing dirs are created after a y/n prompt.
  Platforms: Linux, Windows, macOS via platform-neutral std APIs. Development and tests run on
  Linux only; Windows has had a manual pass (works). macOS is untested (no machine available to
  check it); it relies on the platform-neutral APIs only. Fixes land as separate changes.
  Tech stack: Go, Bubble Tea (TUI), Bubbles textarea/textinput, Glamour (markdown render),
  Lip Gloss (styling), BurntSushi/toml (config), goccy/go-yaml (front matter). Fuzzy
  matching is an in-house case-insensitive
  subsequence match that keeps mtime order (no scoring, no library).
  Themes: all styles live in one theme package and are derived (theme.Apply, called in main before
  any model exists) from a Palette: background, foreground, optional selection (defaults to
  bright_black) and the sixteen ANSI colors, each "#rrggbb". The config key theme names the
  palette (default gruvbox_dark); lookup is <config dir>/clipt/themes/<name>.toml first, then the
  two built-ins embedded from internal/ui/theme/builtin (gruvbox_dark, gruvbox_light), which the
  release archives also ship under themes/. Unknown theme, missing key, bad color or bad TOML is a
  startup error naming the file. The root view puts the palette on screen: on Linux and macOS it
  sets the terminal's default colors (tea.View BackgroundColor/ForegroundColor, reset by Bubble
  Tea on exit); on Windows, whose console drops the resets, it paints every cell of its content
  instead (theme.PaintScreen over an ultraviolet screen buffer, chosen by a package-level
  paintPerCell switch in internal/ui/app) and never changes the terminal's colors. No element
  except the editor selection sets a background. Fenced code is not syntax highlighted (all code is bright_cyan).
  Module path: github.com/llysyganicz/clipt
  VCS: Jujutsu (jj), colocated with git.
  Out of scope: content search, folders, sync, vim normal mode.

rules:
  proposal:
    - Keep scope minimal; state explicit non-goals
  design:
    - Model each mode as its own Bubble Tea model; root model routes between them
  tasks:
    - Every task touching file I/O includes a test using a temp dir

